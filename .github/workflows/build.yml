name: build

on:
    push:
        branches: [main]
        paths:
            - .github/**
            - src/**
            - test/**
            - Makefile
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    SQLITE_RELEASE_YEAR: "2024"
    SQLITE_VERSION: "3470200"

jobs:
    build:
        name: Build for ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                    - os: windows-latest
                    - os: macos-latest

        steps:
            - uses: actions/checkout@v6

            - name: Download SQLite sources
              shell: bash
              run: |
                  make prepare-dist
                  make download-sqlite

            - name: Build for Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  make check

            - name: Build for Windows
              if: matrix.os == 'windows-latest'
              shell: bash
              run: make build

            - name: Build for macOS
              if: matrix.os == 'macos-latest'
              run: make build
